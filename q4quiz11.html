<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f2;
            color: #ff1493;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .input-section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            border: 2px dashed #ff1493;
            box-shadow: 0px 0px 10px rgba(255, 20, 147, 0.3);
        }

        .input-section h2 {
            font-size: 18px;
        }

        .input-section .highlight {
            color: #ff1493;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 10px;
            color: #ff1493;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            border-radius: 5px;
            border: 2px solid #ff1493;
            background-color: #fff0f5;
            color: #ff1493;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            color: lightpink;
            font-weight: bold;
        }

        .pink {
            background-color: #ff69b4;
        }

        .light-pink {
            background-color: #ffb6c1;
            color: #ff1493;
        }

        .white {
            background-color: white;
            color: #ff1493;
            border: 2px solid #ff1493;
        }

        .dark-pink {
            background-color: #ff1493;
        }

        details {
            margin: 10px 0;
        }

    </style>
</head>
<body>

<div class="container">
    <img src="https://www.yttags.com/img_tools/bmi-calculator.png?v=33" width="300px">

     <div class="input-section">
        <h2>Let's calculate your <span class="highlight">BMI!</span></h2>
        <p>( BMI, or Body Mass Index, is a measure of body fat based on height and weight. )</p>

        <!-- Instructions using ontoggle -->
        <details ontoggle="alert('This section shows instructions for BMI calculation.')">
            <summary><strong>Click to show instructions</strong></summary>
            <p>Enter your weight in kilograms and height in meters. Then click the button to calculate your BMI.</p>
        </details>

        <label for="num1">Enter your weight in kilograms:</label>
        <input type="number" id="num1">

        <label for="num2">Enter your height in meters:</label>
        <input type="number" id="num2">

        <button class="pink" onclick="calculate()">Click here</button>

        <p id="result" style="margin-top:15px; font-weight:bold;"></p>
    </div>

    <!-- Source link -->
    <p style="margin-top: 20px;">
        Source: 
        <a href="https://www.who.int/europe/news-room/fact-sheets/item/a-healthy-lifestyle---who-recommendations" target="_blank">
            WHO Recommendations
        </a>
    </p>
</div>

<script>
    // Function to calculate BMI
    function calculate() {
        let weight = parseFloat(document.getElementById("num1").value);
        let height = parseFloat(document.getElementById("num2").value);

        // Check if input is valid
        if (isNaN(weight) || isNaN(height) || height <= 0) {
            alert("Please enter valid numbers for weight and height.");
            return;
        }

        let bmi = weight / Math.pow(height, 2); // BMI formula
        let category = "";

        // Conditional statements to check BMI range
        if (bmi < 18.5) {
            category = "Underweight";
        } else if (bmi >= 18.5 && bmi <= 24.9) {
            category = "Normal weight";
        } else if (bmi >= 25 && bmi <= 29.9) {
            category = "Overweight";
        } else {
            category = "Obese";
        }

        // Output result
        document.getElementById("result").innerHTML = 
            "Your BMI is <strong>" + bmi.toFixed(2) + "</strong> (" + category + ")";
    }
</script>

</body>
</html>
